<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Relojito - Create Timer</title>

                        "background": "#f8f9fa",
                        "on-secondary-fixed": "#07006c",
                        "on-error-container": "#93000a",

                        "unit": "4px",

                        "gutter": "24px",
                        "lg": "24px"

                    "fontFamily": {
                        "h2": ["Inter"],

                },
            },

<style>
        body {
            background-color: #f8f9fa;
            color: #191c1d;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-slate-950 border-b border-slate-100 dark:border-slate-800">
<div class="flex items-center justify-between px-6 h-14 max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<h1 class="font-h2 text-h2 tracking-tight text-slate-900">Create Timer</h1>
</div>
<button class="text-slate-700 dark:text-slate-300 active:scale-95 transition-transform hover:bg-slate-50 dark:hover:bg-slate-900 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button></div>
</header>
<!-- Main Content -->
<main class="flex-1 mt-14 pb-24 max-w-[800px] mx-auto w-full px-6">
<!-- Icon Preview Section -->
<section class="py-12 flex flex-col items-center justify-center">
<div class="w-24 h-24 bg-secondary-container rounded-3xl flex items-center justify-center shadow-lg shadow-secondary-container/20">
<span class="material-symbols-outlined text-white text-[48px]" data-icon="timer" data-weight="fill" style='font-variation-settings: "FILL" 1;'>timer</span>
</div>
</section>
<!-- Form Section -->
<div class="space-y-xl">
<!-- Activity Name -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-wider">NAME</label>
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/20 transition-all font-body-md text-body-md text-on-surface" placeholder="Deep Work, Meditation..." type="text"/>
</div>
<!-- Accent Color -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-wider">color</label>
<div class="flex flex-wrap gap-md">
<button class="w-10 h-10 rounded-full bg-secondary-container border-4 border-white shadow-sm ring-2 ring-secondary transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-tertiary-container border-4 border-white shadow-sm transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-[#f43f5e] border-4 border-white shadow-sm transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-[#10b981] border-4 border-white shadow-sm transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-[#f59e0b] border-4 border-white shadow-sm transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-[#8b5cf6] border-4 border-white shadow-sm transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-[#0ea5e9] border-4 border-white shadow-sm transition-transform active:scale-90"></button>
<button class="w-10 h-10 rounded-full bg-slate-200 border-4 border-white shadow-sm flex items-center justify-center transition-transform hover:scale-110 active:scale-90">
<span class="material-symbols-outlined text-slate-600 text-sm" data-icon="add">add</span>
</button></div>
</div>
<!-- Icon Grid -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-wider">ICON</label>
<div class="grid grid-cols-4 sm:grid-cols-6 gap-md rounded-xl">
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="work">work</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg bg-secondary-container/10 transition-colors text-secondary hover:bg-surface-container-highest">
<span class="material-symbols-outlined" data-icon="timer" data-weight="fill" style='font-variation-settings: "FILL" 1;'>timer</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="book">book</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="local_cafe">local_cafe</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="self_improvement">self_improvement</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="headphones">headphones</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="code">code</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="bed">bed</span>
</button>
<button class="aspect-square flex items-center justify-center rounded-lg transition-colors text-on-surface-variant hover:bg-surface-container-highest bg-transparent">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</div>
</div>
</div>
<!-- Visual Anchor/Hero Image -->
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 w-full p-6 bg-white/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800">
<div class="max-w-[800px] mx-auto"><div class="flex flex-row items-center gap-4">
<button class="flex-1 h-14 text-slate-500 font-body-md text-body-md font-medium hover:text-slate-700 active:scale-[0.98] transition-all flex items-center justify-center">
    Cancel
  </button>
<button class="flex-1 h-14 bg-secondary text-white font-body-lg text-body-lg font-semibold rounded-xl active:scale-[0.98] transition-all shadow-lg shadow-secondary/20 flex items-center justify-center gap-2">
    Save
  </button>
</div></div>
</footer>
</body></html>
