<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "secondary-fixed-dim": "#c0c1ff",
            "secondary": "#4648d4",
            "surface-dim": "#d9dadb",
            "primary": "#27354f",
            "on-tertiary-fixed-variant": "#59431d",
            "on-error": "#ffffff",
            "surface-variant": "#e1e3e4",
            "on-primary-fixed-variant": "#394762",
            "primary-fixed": "#d7e3ff",
            "on-primary-container": "#aebddd",
            "tertiary-fixed": "#ffdeaa",
            "surface-container": "#edeeef",
            "secondary-container": "#6063ee",
            "on-background": "#191c1d",
            "on-secondary": "#ffffff",
            "inverse-surface": "#2e3132",
            "surface-container-highest": "#e1e3e4",
            "surface-container-low": "#f3f4f5",
            "on-tertiary-fixed": "#271900",
            "on-surface": "#191c1d",
            "on-tertiary-container": "#d6b887",
            "tertiary-container": "#5e4821",
            "background": "#f8f9fa",
            "primary-container": "#3e4c67",
            "error-container": "#ffdad6",
            "error": "#ba1a1a",
            "outline": "#75777e",
            "inverse-primary": "#b8c7e7",
            "surface-container-high": "#e7e8e9",
            "on-primary": "#ffffff",
            "surface-bright": "#f8f9fa",
            "secondary-fixed": "#e1e0ff",
            "surface": "#f8f9fa",
            "on-primary-fixed": "#0c1b34",
            "tertiary": "#45320c",
            "tertiary-fixed-dim": "#e1c290",
            "on-secondary-fixed": "#07006c",
            "on-error-container": "#93000a",
            "surface-tint": "#515f7a",
            "outline-variant": "#c5c6ce",
            "on-tertiary": "#ffffff",
            "on-secondary-container": "#fffbff",
            "inverse-on-surface": "#f0f1f2",
            "surface-container-lowest": "#ffffff",
            "on-surface-variant": "#44474d",
            "primary-fixed-dim": "#b8c7e7",
            "on-secondary-fixed-variant": "#2f2ebe"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "unit": "4px",
            "sm": "8px",
            "xl": "40px",
            "md": "16px",
            "margin": "32px",
            "lg": "24px",
            "xs": "4px",
            "gutter": "24px"
          },
          "fontFamily": {
            "label-sm": ["Inter"],
            "h2": ["Inter"],
            "h1": ["Inter"],
            "body-lg": ["Inter"],
            "h3": ["Inter"],
            "body-md": ["Inter"]
          },
          "fontSize": {
            "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}],
            "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.015em", "fontWeight": "600"}],
            "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "body-lg": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
            "h3": ["18px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "500"}],
            "body-md": ["14px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden h-screen">
<!-- Background Content (Blurred Dashboard) -->
<div class="fixed inset-0 z-0 flex flex-col blur-md opacity-40 select-none pointer-events-none">
<header class="flex items-center justify-between px-6 py-3 h-14 w-full bg-white border-b border-slate-200">
<div class="text-lg font-semibold text-slate-900 font-sans tracking-tight">Relojito</div>
<div class="w-8 h-8 rounded-full bg-slate-200"></div>
</header>
<main class="flex-1 p-gutter max-w-4xl mx-auto w-full space-y-lg">
<div class="h-32 bg-white border border-black/10 rounded-xl"></div>
<div class="grid grid-cols-2 gap-md">
<div class="h-48 bg-white border border-black/10 rounded-xl"></div>
<div class="h-48 bg-white border border-black/10 rounded-xl"></div>
</div>
<div class="h-64 bg-white border border-black/10 rounded-xl"></div>
</main>
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 bg-white border-t border-slate-200">
<div class="text-indigo-600 border-t-2 border-indigo-600 pt-3 pb-2 text-[11px] font-medium flex flex-col items-center">
<span class="material-symbols-outlined">timer</span>
        Tracker
      </div>
<div class="text-slate-500 pt-3 pb-2 text-[11px] font-medium flex flex-col items-center">
<span class="material-symbols-outlined">history</span>
        History
      </div>
<div class="text-slate-500 pt-3 pb-2 text-[11px] font-medium flex flex-col items-center">
<span class="material-symbols-outlined">analytics</span>
        Stats
      </div>
<div class="text-slate-500 pt-3 pb-2 text-[11px] font-medium flex flex-col items-center">
<span class="material-symbols-outlined">settings</span>
        Settings
      </div>
</nav>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-primary/20 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-[480px] rounded-xl shadow-2xl overflow-hidden border border-outline-variant flex flex-col max-h-[795px]">
<!-- Header -->
<div class="px-lg py-md flex items-center justify-between border-b border-surface-container-high">
<h2 class="font-h2 text-h2 text-primary">Manual time entry</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content (Scrollable) -->
<div class="flex-1 overflow-y-auto p-lg space-y-lg hide-scrollbar">
<!-- Activity Section -->
<section class="space-y-md">
<label class="font-h3 text-h3 text-primary block">Select Activity</label>
<div class="grid grid-cols-4 gap-sm">
<!-- Activity Item: Active -->
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg bg-[#6366F1] text-white transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="work" style="font-variation-settings: 'FILL' 1;">work</span>
<span class="font-label-sm text-label-sm">Work</span>
</button>
<!-- Activity Items: Inactive -->
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="laptop_mac">laptop_mac</span>
<span class="font-label-sm text-label-sm">Project</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="meeting_room">meeting_room</span>
<span class="font-label-sm text-label-sm">Meeting</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="school">school</span>
<span class="font-label-sm text-label-sm">Study</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="exercise">exercise</span>
<span class="font-label-sm text-label-sm">Fitness</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="brush">brush</span>
<span class="font-label-sm text-label-sm">Design</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="code">code</span>
<span class="font-label-sm text-label-sm">Code</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="call">call</span>
<span class="font-label-sm text-label-sm">Call</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-sm text-label-sm">Admin</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="edit">edit</span>
<span class="font-label-sm text-label-sm">Writing</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="menu_book">menu_book</span>
<span class="font-label-sm text-label-sm">Reading</span>
</button>
<button class="group flex flex-col items-center p-sm gap-xs rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-all">
<span class="material-symbols-outlined text-2xl" data-icon="more_horiz">more_horiz</span>
<span class="font-label-sm text-label-sm">Other</span>
</button>
</div>
</section>
<!-- Form Fields -->
<section class="space-y-md">
<!-- Date -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all outline-none" type="text" value="Today, Oct 24"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant">calendar_today</span>
</div>
</div>
<!-- Time Grid -->
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">Start Time</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all outline-none" type="text" value="09:00 AM"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant">schedule</span>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">End Time</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all outline-none" type="text" value="11:30 AM"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-on-surface-variant">schedule</span>
</div>
</div>
</div>
<!-- Duration -->
<div class="p-md rounded-lg bg-surface-container-low border border-black/5 flex items-center justify-between">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-[#6366F1]" style='font-variation-settings: "FILL" 1;'>timelapse</span>
<span class="font-body-md text-on-surface-variant">Time</span>
</div>
<span class="font-h3 text-h3 text-primary">2h 30m</span>
</div>
</section>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-surface-container-high flex gap-md bg-white items-center justify-between">
<button class="py-sm rounded-lg font-body-md text-primary hover:bg-surface-container-high transition-colors w-auto px-lg">
          Cancel
        </button>
<button class="py-3 px-12 rounded-lg font-h3 text-h3 bg-[#6366F1] text-white transition-all hover:opacity-90">Register</button>
</div>
</div>
</div>
</body></html>
