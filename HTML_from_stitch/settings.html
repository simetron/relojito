<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                    "background": "#f8f9fa",

                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#e1e0ff",
                    "surface-container-high": "#e7e8e9",
                    "secondary-container": "#6063ee",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#59431d",
                    "on-surface-variant": "#44474d",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-tint": "#515f7a",
                    "primary-fixed-dim": "#b8c7e7",
                    "on-tertiary-container": "#d6b887",
                    "tertiary-container": "#5e4821",
                    "inverse-primary": "#b8c7e7",
                    "on-primary-fixed-variant": "#394762",
                    "outline": "#75777e",
                    "on-secondary-container": "#fffbff",
                    "inverse-surface": "#2e3132",
                    "secondary-fixed-dim": "#c0c1ff",
                    "on-tertiary-fixed": "#271900",
                    "surface-dim": "#d9dadb",
                    "on-surface": "#191c1d",
                    "surface": "#f8f9fa",
                    "on-secondary-fixed": "#07006c",
                    "tertiary-fixed": "#ffdeaa",
                    "surface-variant": "#e1e3e4",
                    "surface-container": "#edeeef",
                    "surface-bright": "#f8f9fa"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "gutter": "24px",
                    "margin": "32px",
                    "xl": "40px",
                    "md": "16px",
                    "lg": "24px",
                    "unit": "4px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "h3": ["Inter"],
                    "body-md": ["Inter"],
                    "h1": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "h2": ["Inter"]
            },
            "fontSize": {
                    "h3": ["18px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                    "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.015em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-20">
<!-- TopAppBar -->
<header class="sticky top-0 flex items-center justify-between w-full px-6 z-50 bg-white/90 backdrop-blur-sm h-14 border-b border-slate-100">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-700" data-icon="schedule">schedule</span>
<span class="text-xl font-bold tracking-tighter text-slate-900">Relojito</span>
</div>
<div class="flex items-center gap-4">
</div>
</header>
<main class="max-w-[800px] mx-auto px-gutter py-xl">
<!-- Profile Header -->
<section class="mb-xl flex items-center gap-lg p-lg bg-surface-container-lowest rounded-xl border border-black/[0.08]">
<div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 border border-slate-100 bg-slate-50">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a modern tech professional with a friendly expression. The lighting is soft and high-key, creating a clean light-mode aesthetic. The background is a minimalist, neutral gray that complements the professional and organized vibe of the Relojito application's design system. High-quality digital photography with sharp focus on the subject." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8R6_PkLkBEeNDbRAYq4dQb9bsP5XvNaHS4rwzhYRGwJnhYHEf-1PDyEmAwr_uVgXxyHCwQ_xRvh9DhORfHWJq2f-iqGENDWw8VvBgTgLF3oC5ohIZbcISIM6Vwd055e1859i70ullVaTvseRpJ5P_8hnV_bMzFiFP9Zff-A9i0rtzAedsISgcwny5lwG2bksKvQFTeO_rQJ_cTB4kHhzi4HvHKdABGNIA-lWYSfTgdNYNh91nHxjBG5cwNCwt4OwK6ksdhezGd3E"/>
</div>
<div>
<h1 class="font-h2 text-h2 text-slate-900 mb-1">John Doe</h1>
<p class="font-body-md text-body-md text-outline">user@example.com</p>
</div>
</section>
<!-- Settings Groups -->
<div class="space-y-lg">
<!-- Account Security -->
<div class="group">
<h2 class="font-label-sm text-label-sm text-outline uppercase tracking-widest mb-md px-1">Account Security</h2>
<div class="bg-surface-container-lowest border border-black/[0.08] rounded-xl divide-y divide-slate-100 overflow-hidden">
<button class="w-full flex items-center justify-between p-lg hover:bg-slate-50 transition-colors active:scale-[0.99]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-slate-400" data-icon="lock">lock</span>
<span class="font-body-lg text-body-lg text-slate-700">Change Password</span>
</div>
<span class="material-symbols-outlined text-slate-300" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
<!-- Appearance -->
<div class="group">
<h2 class="font-label-sm text-label-sm text-outline uppercase tracking-widest mb-md px-1">Appearance</h2>
<div class="bg-surface-container-lowest border border-black/[0.08] rounded-xl divide-y divide-slate-100 overflow-hidden">
<div class="flex items-center justify-between p-lg">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-slate-400" data-icon="dark_mode">dark_mode</span>
<span class="font-body-lg text-body-lg text-slate-700">Dark Mode</span>
</div>
<div class="w-12 h-6 bg-slate-200 rounded-full relative p-1 cursor-pointer transition-colors">
<div class="w-4 h-4 bg-white rounded-full shadow-sm"></div>
</div>
</div>
</div>
</div>
<!-- Danger Zone -->
<div class="group">
<h2 class="font-label-sm text-label-sm text-error uppercase tracking-widest mb-md px-1">Danger Zone</h2>
<div class="bg-error-container/10 border border-error/10 rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-lg hover:bg-error/5 transition-colors active:scale-[0.99]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-error" data-icon="delete_forever">delete_forever</span>
<span class="font-body-lg text-body-lg text-error font-medium">Delete Account</span>
</div>
<span class="material-symbols-outlined text-error/40" data-icon="warning">warning</span>
</button>
</div>
<p class="mt-md px-1 font-body-md text-label-sm text-outline">
                    Permanently delete your account and all associated data. This action cannot be undone.
                </p>
</div>
<!-- App Info Card -->
<div class="mt-margin pt-margin border-t border-slate-100 flex flex-col items-center gap-xs">
<p class="font-label-sm text-label-sm text-outline">Relojito v2.4.0</p>
<p class="font-label-sm text-label-sm text-outline">Designed for focus and efficiency.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-white border-t border-slate-100">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-slate-400 py-1 px-4 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Home</span>
</button>
<!-- History -->
<button class="flex flex-col items-center justify-center text-slate-400 py-1 px-4 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">History</span>
</button>
<!-- Reports -->
<button class="flex flex-col items-center justify-center text-slate-400 py-1 px-4 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Reports</span>
</button>
<!-- Settings (Active) -->
<button class="flex flex-col items-center justify-center text-slate-900 bg-slate-100 rounded-lg py-1 px-4 transition-transform duration-150 scale-95 active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Settings</span>
</button>
</nav>
</body></html>
